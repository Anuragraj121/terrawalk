services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: terrawalk
      POSTGRES_PASSWORD: terrawalk
      POSTGRES_DB: terrawalk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrawalk"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: ./server
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://terrawalk:terrawalk@db:5432/terrawalk
      JWT_SECRET: change-me-in-production
      JWT_REFRESH_SECRET: change-me-refresh-secret
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3001/api
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:

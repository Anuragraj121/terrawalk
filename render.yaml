services:
  - type: web
    name: terrawalk
    runtime: node
    plan: free
    rootDir: .
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install --include=dev && npx tsc
    startCommand: node server/dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
